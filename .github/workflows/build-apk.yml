name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Application ID (ej. com.totalappgt.aulapro)"
        required: false
        default: "com.totalappgt.aulapro"
      app_name:
        description: "Nombre de la app"
        required: false
        default: "AulaPro"
      app_url:
        description: "URL del sistema"
        required: false
        default: "https://aulapro.totalappgt.com"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias mobile
        working-directory: mobile
        run: npm install

      - name: Agregar plataforma Android
        working-directory: mobile
        run: npx cap add android || true

      - name: Aplicar branding (iconos y splash)
        run: bash mobile/branding/apply-brand.sh

      - name: Sync Capacitor
        working-directory: mobile
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: aulapro-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
